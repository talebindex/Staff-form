<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>لوحة إدارة استمارة الكادر</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<style>
  :root{--p:#3b1f5e;--g:#a67c3b;--bg:#f5f1f8;--card:#fff;--text:#20172b;--muted:#756b7d;--line:#e7e0eb}
  *{box-sizing:border-box}
  body{margin:0;font-family:Tahoma,Arial,sans-serif;background:var(--bg);color:var(--text)}
  header{background:linear-gradient(135deg,#2b173f,#4b2a69);color:#fff;padding:22px 18px;position:sticky;top:0;z-index:5}
  header h1{margin:0 0 7px;font-size:22px}
  header p{margin:0;opacity:.82;font-size:13px}
  main{max-width:1100px;margin:22px auto;padding:0 14px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 5px 18px rgba(35,20,45,.06);margin-bottom:16px}
  label{display:block;font-weight:700;margin-bottom:8px}
  input{width:100%;padding:13px 14px;border:1px solid #d8cedf;border-radius:12px;font-size:16px;outline:none}
  input:focus{border-color:var(--p);box-shadow:0 0 0 3px rgba(59,31,94,.1)}
  button{border:0;border-radius:12px;padding:12px 17px;background:var(--p);color:#fff;font-weight:700;cursor:pointer;font-size:15px}
  button.secondary{background:#eee8f1;color:var(--p)}
  button.gold{background:var(--g)}
  button:disabled{opacity:.55;cursor:not-allowed}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .hidden{display:none!important}
  .msg{margin-top:10px;padding:11px 13px;border-radius:10px;background:#fff5dc;color:#5c4519}
  .error{background:#fdecec;color:#8a2020}
  .stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
  .stat{background:#f2edf5;border-radius:13px;padding:11px 14px;min-width:130px}
  .stat b{display:block;font-size:20px;color:var(--p)}
  .search{margin-bottom:12px}
  .folders{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
  .folder{padding:15px;border:1px solid var(--line);border-radius:14px;background:#fff;cursor:pointer}
  .folder:hover{border-color:var(--p);background:#fbf9fc}
  .folder-name{font-weight:800;word-break:break-word}
  .folder-sub{font-size:12px;color:var(--muted);margin-top:5px}
  .detail-head{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}
  .name{font-size:21px;font-weight:800}
  .meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:9px;margin-top:14px}
  .field{border:1px solid var(--line);border-radius:12px;padding:10px}
  .field small{display:block;color:var(--muted);margin-bottom:4px}
  .files{display:grid;gap:9px;margin-top:14px}
  .file{display:flex;justify-content:space-between;gap:10px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:11px;flex-wrap:wrap}
  .file-name{font-weight:700;word-break:break-word}
  .file-size{font-size:12px;color:var(--muted)}
  a.btn{display:inline-block;text-decoration:none;border-radius:10px;padding:9px 12px;background:#eee8f1;color:var(--p);font-weight:700}
  .loading{padding:20px;text-align:center;color:var(--muted)}
  .export-progress{margin-top:10px;padding:11px 13px;border-radius:10px;background:#f2edf5;color:var(--p)}
  .export-progress.error{background:#fdecec;color:#8a2020}
  .top-actions{display:flex;gap:8px;flex-wrap:wrap}
  @media(max-width:600px){header h1{font-size:18px}.card{padding:14px}.file{align-items:flex-start}}
</style>
</head>
<body>
<header>
  <h1>لوحة إدارة استمارة الكادر</h1>
  <p>صفحة خاصة لعرض بيانات الموظفين والمستمسكات المخزنة في Cloudflare R2</p>
</header>

<main>
  <section id="loginCard" class="card">
    <h2 style="margin-top:0">دخول الإدارة</h2>
    <label for="password">كلمة مرور الإدارة</label>
    <input id="password" type="password" autocomplete="current-password" placeholder="أدخل كلمة المرور">
    <div class="row" style="margin-top:12px">
      <button id="loginBtn">دخول</button>
    </div>
    <div id="loginMsg" class="msg hidden"></div>
  </section>

  <section id="dashboard" class="hidden">
    <div class="card">
      <div class="top-actions">
        <button id="refreshBtn">تحديث القائمة</button>
        <button id="exportAllBtn" class="gold">⬇️ Excel — جميع الموظفين</button>
        <button id="logoutBtn" class="secondary">تسجيل الخروج</button>
      </div>
      <div id="dashMsg" class="msg hidden"></div>
    </div>

    <div id="listCard" class="card">
      <div class="stats">
        <div class="stat"><b id="count">0</b><span>عدد الموظفين</span></div>
      </div>
      <input id="search" class="search" placeholder="بحث باسم الموظف أو رقم البطاقة الموحدة...">
      <div id="folders" class="folders"></div>
      <div id="listLoading" class="loading hidden">جاري تحميل البيانات...</div>
    </div>

    <div id="detailCard" class="card hidden">
      <div class="detail-head">
        <div>
          <div id="detailName" class="name"></div>
          <div id="detailSub" style="color:var(--muted);font-size:13px;margin-top:4px"></div>
        </div>
        <div class="row">
          <button id="exportOneBtn" class="gold">⬇️ Excel — هذا الموظف</button>
          <button id="pdfOneBtn">📄 PDF — مستمسكات هذا الموظف</button>
          <button id="backBtn" class="secondary">العودة للقائمة</button>
        </div>
      </div>
      <div id="meta" class="meta"></div>
      <h3>المستمسكات والملفات</h3>
      <div id="files" class="files"></div>
    </div>
  </section>
</main>

<script>
const WORKER_URL = "https://small-thunder-126d.hassanfaleh2018.workers.dev/";
let adminPassword = "";
let folders = [];

const labels = {
  referenceNumber:"رقم الاستمارة",
  fullName:"الاسم الرباعي",
  name:"الاسم",
  employeeType:"نوع الموظف",
  jobType:"نوع الموظف",
  firstName:"الاسم الأول",
  fatherName:"اسم الأب",
  grandfatherName:"اسم الجد",
  familyName:"اللقب",
  title:"اللقب",
  gender:"الجنس",
  dob:"تاريخ التولد",
  birthDate:"تاريخ التولد",
  birthPlace:"محل التولد",
  motherName:"اسم الأم",
  bloodType:"فصيلة الدم",
  socialStatus:"الحالة الاجتماعية",
  religion:"الديانة",
  phone:"رقم الهاتف",
  mobile:"رقم الهاتف",
  nationalId:"رقم البطاقة الموحدة",
  idNumber:"رقم البطاقة الموحدة",
  cardNumber:"رقم البطاقة الموحدة",
  jobTitle:"العنوان الوظيفي",
  jobStatus:"الحالة الوظيفية",
  jobStatusOther:"تفاصيل الحالة الوظيفية",
  specialization:"الاختصاص",
  qualification:"التحصيل الدراسي",
  gradDate:"تاريخ التخرج",
  university:"الجامعة",
  college:"الكلية",
  department:"القسم",
  school:"المدرسة",
  firstAppDate:"تاريخ أول تعيين",
  address:"عنوان السكن",
  governorate:"المحافظة",
  district:"القضاء",
  landmark:"أقرب نقطة دالة",
  notes:"ملاحظات",
  createdAt:"تاريخ الإرسال"
};

const fileLabels = {
  idFront:"الوجه الأمامي للبطاقة الموحدة",
  idBack:"الوجه الخلفي للبطاقة الموحدة",
  personalPhoto:"الصورة الشخصية",
  gradDoc:"وثيقة التخرج",
  adminOrder:"الأمر الإداري",
  commencementOrder:"أمر المباشرة",
  submissionData:"بيانات الاستمارة"
};

const $ = id => document.getElementById(id);

function showMsg(el, text, error=false){
  el.textContent=text;
  el.classList.remove("hidden");
  el.classList.toggle("error", error);
}
function hideMsg(el){el.classList.add("hidden")}
function esc(v){
  return String(v ?? "").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]));
}
function bytes(n){
  if(!Number.isFinite(n)) return "";
  if(n>=1024*1024) return (n/1024/1024).toFixed(1)+" MB";
  if(n>=1024) return Math.round(n/1024)+" KB";
  return n+" B";
}
function humanKey(key){
  const name=key.split("/").pop() || key;
  const base=name.replace(/_\d+(?=\.[^.]+$)/,"");
  const k=base.split("_")[0];
  return fileLabels[k] || name;
}

async function api(body){
  const res=await fetch(WORKER_URL,{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({...body,password:adminPassword})
  });
  const text=await res.text();
  let data;
  try{data=JSON.parse(text)}catch{throw new Error("استجابة غير صالحة من الخادم.");}
  if(!res.ok) throw new Error(data.error || data.detail || "حدث خطأ.");
  return data;
}

async function login(){
  const p=$("password").value;
  if(!p){showMsg($("loginMsg"),"أدخل كلمة المرور.",true);return}
  adminPassword=p;
  $("loginBtn").disabled=true;
  hideMsg($("loginMsg"));
  try{
    const data=await api({action:"adminList"});
    folders=data.folders||[];
    $("loginCard").classList.add("hidden");
    $("dashboard").classList.remove("hidden");
    renderFolders();
  }catch(e){
    adminPassword="";
    showMsg($("loginMsg"),e.message,true);
  }finally{$("loginBtn").disabled=false}
}

async function loadList(){
  $("listLoading").classList.remove("hidden");
  try{
    const data=await api({action:"adminList"});
    folders=data.folders||[];
    renderFolders();
    hideMsg($("dashMsg"));
  }catch(e){showMsg($("dashMsg"),e.message,true)}
  finally{$("listLoading").classList.add("hidden")}
}

function renderFolders(){
  const q=$("search").value.trim().toLowerCase();
  const filtered=folders.filter(x=>x.toLowerCase().includes(q));
  $("count").textContent=folders.length;
  $("folders").innerHTML="";
  if(!filtered.length){
    $("folders").innerHTML='<div class="loading">لا توجد نتائج.</div>';
    return;
  }
  filtered.forEach(folder=>{
    const div=document.createElement("div");
    div.className="folder";
    div.innerHTML=`<div class="folder-name">${esc(folder)}</div><div class="folder-sub">اضغط لعرض البيانات والمستمسكات</div>`;
    div.onclick=()=>openFolder(folder);
    $("folders").appendChild(div);
  });
}

async function openFolder(folder){
  $("listCard").classList.add("hidden");
  $("detailCard").classList.remove("hidden");
  $("detailName").textContent=folder;
  $("detailSub").textContent="جاري تحميل بيانات الموظف...";
  $("meta").innerHTML='<div class="loading">جاري التحميل...</div>';
  $("files").innerHTML="";
  try{
    const data=await api({action:"adminDetails",folder});
    window.currentEmployeeData=data;
    renderDetails(data);
  }catch(e){
    $("detailSub").textContent="";
    $("meta").innerHTML=`<div class="msg error">${esc(e.message)}</div>`;
  }
}

function renderDetails(data){
  const m=data.metadata||{};

  $("detailSub").textContent = m.createdAt
    ? "تاريخ الإرسال: " + new Date(m.createdAt).toLocaleString("ar-IQ")
    : "";

  $("meta").innerHTML="";

  // نعرض فقط الحقول التي لها عنوان عربي معروف.
  // أي حقول تقنية أو غير معروفة يتم تجاهلها ولا يظهر اسمها البرمجي.
  const preferredOrder = [
    "referenceNumber",
    "employeeType",
    "fullName",
    "title",
    "dob",
    "gender",
    "idNumber",
    "motherName",
    "bloodType",
    "socialStatus",
    "religion",
    "jobTitle",
    "jobStatus",
    "jobStatusOther",
    "qualification",
    "college",
    "specialization",
    "gradDate",
    "firstAppDate",
    "phone",
    "address",
    "landmark",
    "governorate",
    "district",
    "university",
    "department",
    "school",
    "notes",
    "createdAt"
  ];

  const shown = new Set();

  preferredOrder.forEach(k => {
    const v = m[k];

    if (
      !(k in labels) ||
      v === null ||
      v === undefined ||
      v === "" ||
      typeof v === "object"
    ) return;

    shown.add(k);

    const div=document.createElement("div");
    div.className="field";
    div.innerHTML =
      `<small>${esc(labels[k])}</small>` +
      `<strong>${esc(v)}</strong>`;

    $("meta").appendChild(div);
  });

  // في حال كانت هناك حقول معروفة في القاموس لكنها لم تدخل في الترتيب أعلاه.
  Object.entries(m).forEach(([k,v]) => {
    if (
      shown.has(k) ||
      !(k in labels) ||
      v === null ||
      v === undefined ||
      v === "" ||
      typeof v === "object"
    ) return;

    const div=document.createElement("div");
    div.className="field";
    div.innerHTML =
      `<small>${esc(labels[k])}</small>` +
      `<strong>${esc(v)}</strong>`;

    $("meta").appendChild(div);
    shown.add(k);
  });

  if(!$("meta").children.length){
    $("meta").innerHTML='<div class="loading">لم يتم العثور على بيانات الموظف.</div>';
  }

  $("files").innerHTML="";

  (data.files||[]).forEach(f=>{
    const div=document.createElement("div");
    div.className="file";

    // نحدد اسم المستند من مفتاح الملف، ولا نعرض اسم الملف البرمجي الخام.
    const rawName = String(f.name || "");
    const rawKey = String(f.key || "");

    let fileKey = "";
    for (const key of Object.keys(fileLabels)) {
      if (
        rawName.startsWith(key + "_") ||
        rawKey.includes("/" + key + "_")
      ) {
        fileKey = key;
        break;
      }
    }

    const label = fileLabels[fileKey] || "مرفق";

    div.innerHTML=`
      <div>
        <div class="file-name">${esc(label)}</div>
        <div class="file-size">${bytes(f.size)}</div>
      </div>
      <div class="row">
        <a class="btn" target="_blank" rel="noopener"
           href="${esc(f.downloadUrl)}">فتح / تحميل</a>
      </div>`;

    $("files").appendChild(div);
  });

  if(!(data.files||[]).length){
    $("files").innerHTML='<div class="loading">لا توجد مستمسكات أو ملفات.</div>';
  }
}
async function downloadBlob(blob, filename){
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;
  a.download=filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),2000);
}

function safeFilename(value){
  return String(value||"")
    .replace(/[\\/:*?"<>|]/g,"_")
    .replace(/\s+/g," ")
    .trim()
    .slice(0,120) || "موظف";
}

function metadataForExcel(m){
  const row={};
  const order=[
    "referenceNumber","fullName","employeeType","title","dob","gender",
    "idNumber","motherName","bloodType","socialStatus","religion",
    "jobTitle","jobStatus","jobStatusOther","qualification","college",
    "specialization","gradDate","firstAppDate","phone","address",
    "landmark","governorate","district","university","department",
    "school","notes","createdAt"
  ];

  order.forEach(k=>{
    if(k in m && m[k]!==null && m[k]!==undefined && m[k]!=="" && k in labels){
      row[labels[k]]=typeof m[k]==="object" ? JSON.stringify(m[k]) : m[k];
    }
  });

  // إضافة أي حقل معروف في قاموس الترجمة ولم يرد في الترتيب.
  Object.entries(m).forEach(([k,v])=>{
    if(
      k in labels &&
      !(labels[k] in row) &&
      v!==null &&
      v!==undefined &&
      v!=="" &&
      typeof v!=="object"
    ){
      row[labels[k]]=v;
    }
  });

  return row;
}

async function exportOneExcel(){
  const data=window.currentEmployeeData;
  if(!data || !data.metadata){
    showMsg($("dashMsg"),"لا توجد بيانات موظف متاحة للتصدير.",true);
    return;
  }

  const m=data.metadata;
  const row=metadataForExcel(m);

  if(typeof XLSX==="undefined"){
    showMsg($("dashMsg"),"تعذر تحميل مكتبة Excel. تحقق من اتصال الإنترنت ثم أعد المحاولة.",true);
    return;
  }

  const ws=XLSX.utils.json_to_sheet([row]);
  ws["!cols"]=Object.keys(row).map(()=>({wch:24}));
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,"بيانات الموظف");

  const name=safeFilename(m.fullName || m.name || data.folder || "موظف");
  XLSX.writeFile(wb,`بيانات_${name}.xlsx`);
}

async function exportAllExcel(){
  const btn=$("exportAllBtn");
  btn.disabled=true;
  showMsg($("dashMsg"),"جاري جمع بيانات جميع الموظفين وإنشاء ملف Excel...");

  try{
    const data=await api({action:"adminExportData"});
    const rows=(data.records||[]).map(x=>metadataForExcel(x.metadata||{}));

    if(!rows.length){
      throw new Error("لم يتم العثور على بيانات موظفين.");
    }

    if(typeof XLSX==="undefined"){
      throw new Error("تعذر تحميل مكتبة Excel. تحقق من اتصال الإنترنت ثم أعد المحاولة.");
    }

    const ws=XLSX.utils.json_to_sheet(rows);
    ws["!cols"]=Object.keys(rows[0]).map(()=>({wch:24}));

    const wb=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb,ws,"بيانات الموظفين");

    const now=new Date();
    const stamp=
      now.getFullYear()+"-"+String(now.getMonth()+1).padStart(2,"0")+"-"+String(now.getDate()).padStart(2,"0");

    XLSX.writeFile(wb,`بيانات_جميع_الموظفين_${stamp}.xlsx`);
    showMsg($("dashMsg"),`تم إنشاء ملف Excel ويحتوي على ${rows.length} موظف.`);
  }catch(e){
    showMsg($("dashMsg"),e.message,true);
  }finally{
    btn.disabled=false;
  }
}

async function exportOnePdf(){
  const data=window.currentEmployeeData;

  if(!data || !data.metadata){
    showMsg($("dashMsg"),"لا توجد بيانات الموظف لإنشاء ملف PDF.",true);
    return;
  }

  if(typeof PDFLib==="undefined"){
    showMsg($("dashMsg"),"تعذر تحميل مكتبة PDF. تحقق من اتصال الإنترنت ثم أعد المحاولة.",true);
    return;
  }

  const btn=$("pdfOneBtn");
  btn.disabled=true;

  try{
    const PDFDocument=PDFLib.PDFDocument;
    const pdf=await PDFDocument.create();

    const m=data.metadata;
    const employeeName=m.fullName || m.name || data.folder || "الموظف";

    // يتم دمج المستندات الأصلية كما هي دون ضغط أو تغيير في الجودة.

    const orderedKeys=[
      "idFront","idBack","personalPhoto","gradDoc","adminOrder","commencementOrder"
    ];

    const wanted=[];

    orderedKeys.forEach(k=>{
      const f=(data.files||[]).find(file=>{
        const n=String(file.name||"");
        const key=String(file.key||"");
        return n.startsWith(k+"_") || key.includes("/"+k+"_");
      });
      if(f) wanted.push({key:k,file:f});
    });

    if(!wanted.length){
      throw new Error("لم يتم العثور على مستمسكات قابلة للدمج لهذا الموظف.");
    }

    for(const item of wanted){
      const f=item.file;
      const response=await fetch(f.downloadUrl);
      if(!response.ok){
        throw new Error(`تعذر تحميل المستند: ${fileLabels[item.key]||"المرفق"}`);
      }

      const type=(response.headers.get("content-type")||"").toLowerCase();
      const bytes=new Uint8Array(await response.arrayBuffer());

      if(type.includes("pdf") || String(f.name).toLowerCase().endsWith(".pdf")){
        const src=await PDFDocument.load(bytes);
        const pages=await pdf.copyPages(src,src.getPageIndices());
        pages.forEach(p=>pdf.addPage(p));
      }else if(
        type.includes("jpeg") ||
        type.includes("jpg") ||
        String(f.name).toLowerCase().match(/\.jpe?g$/)
      ){
        const image=await pdf.embedJpg(bytes);
        const scale=Math.min(
          535/image.width,
          760/image.height,
          1
        );
        const w=image.width*scale;
        const h=image.height*scale;
        const page=pdf.addPage([595.28,841.89]);
        page.drawImage(image,{
          x:(595.28-w)/2,
          y:(841.89-h)/2,
          width:w,
          height:h
        });
      }else if(
        type.includes("png") ||
        String(f.name).toLowerCase().endsWith(".png")
      ){
        const image=await pdf.embedPng(bytes);
        const scale=Math.min(
          535/image.width,
          760/image.height,
          1
        );
        const w=image.width*scale;
        const h=image.height*scale;
        const page=pdf.addPage([595.28,841.89]);
        page.drawImage(image,{
          x:(595.28-w)/2,
          y:(841.89-h)/2,
          width:w,
          height:h
        });
      }else{
        // HEIC/HEIF لا يمكن دمجها مباشرة في pdf-lib داخل المتصفح.
        console.warn("تم تجاوز ملف غير مدعوم في PDF:",f.name);
      }
    }

    const out=await pdf.save();
    const blob=new Blob([out],{type:"application/pdf"});
    await downloadBlob(
      blob,
      `مستمسكات_${safeFilename(employeeName)}.pdf`
    );

    showMsg($("dashMsg"),"تم إنشاء ملف PDF للمستمسكات بنجاح.");
  }catch(e){
    showMsg($("dashMsg"),e.message || "تعذر إنشاء ملف PDF.",true);
  }finally{
    btn.disabled=false;
  }
}


$("loginBtn").onclick=login;
$("password").addEventListener("keydown",e=>{if(e.key==="Enter")login()});
$("refreshBtn").onclick=loadList;
$("exportAllBtn").onclick=exportAllExcel;
$("exportOneBtn").onclick=exportOneExcel;
$("pdfOneBtn").onclick=exportOnePdf;
$("search").oninput=renderFolders;
$("backBtn").onclick=()=>{
  window.currentEmployeeData=null;
  $("detailCard").classList.add("hidden");
  $("listCard").classList.remove("hidden");
};
$("logoutBtn").onclick=()=>{
  adminPassword="";
  folders=[];
  window.currentEmployeeData=null;
  $("dashboard").classList.add("hidden");
  $("loginCard").classList.remove("hidden");
  $("password").value="";
};
</script>
