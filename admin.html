<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>إدارة استمارات الموظفين</title>

  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root{
      --ink: #3a2158;
      --ink-dark: #281341;
      --ink-soft: #6d5c8a;
      --brass: #b3822f;
      --brass-light: #e9d29f;
      --paper: #f3f1f6;
      --border: #e3ddee;
      --text: #251a35;
      --muted: #726a85;
      --success: #1f7a4d;
      --success-bg: #eaf6f0;
      --warn-bg: #fdf6e7;
      --warn-border: #ecdba8;
      --warn-text: #8a5a12;
      --danger: #b91c1c;
      --danger-bg: #fdeceb;
      --danger-border: #f3c6c2;
      --info-bg: #f1edf9;
      --info-border: #e0d6f2;
      --info-text: #4b3a68;
    }
    *{ font-family: 'IBM Plex Sans Arabic', Tahoma, sans-serif; box-sizing: border-box; }
    body{ background: var(--paper); margin:0; color: var(--text); }
    .font-display{ font-family: 'Cairo', sans-serif; }

    .wrap{ max-width: 1200px; margin: 0 auto; padding: 0 16px 40px; }

    /* ---- شريط الهوية العلوي (متطابق مع استمارة الكادر) ---- */
    .admin-header{
      position: relative; overflow: hidden;
      background: linear-gradient(160deg, var(--ink) 0%, var(--ink-dark) 100%);
      border-radius: 0 0 22px 22px;
      padding: 1.9rem 1.25rem 2.2rem;
      text-align: center; margin-bottom: 24px;
    }
    .admin-header::before{
      content:""; position:absolute; inset:0; opacity:0.16;
      background-image:
        radial-gradient(circle at 15% 20%, rgba(255,255,255,0.5) 0, transparent 40%),
        repeating-linear-gradient(45deg, rgba(255,255,255,0.25) 0 1px, transparent 1px 26px),
        repeating-linear-gradient(-45deg, rgba(255,255,255,0.25) 0 1px, transparent 1px 26px);
    }
    .admin-header::after{
      content:""; position:absolute; left:0; right:0; bottom:0; height:5px;
      background: linear-gradient(90deg, var(--brass), var(--brass-light), var(--brass));
    }
    .admin-header-inner{ position:relative; z-index:1; }
    .admin-emblem{
      width:72px; height:72px; border-radius:9999px; overflow:hidden; background:#fff;
      margin:0 auto 12px; display:flex; align-items:center; justify-content:center;
      box-shadow: 0 0 0 3px rgba(255,255,255,0.25), 0 10px 22px -8px rgba(0,0,0,0.5);
    }
    .admin-emblem img{ width:100%; height:100%; object-fit:cover; }
    .admin-header h1{ color:#fff; font-family:'Cairo',sans-serif; font-weight:800; font-size:1.35rem; margin:0 0 4px; }
    .admin-header p{ color: rgba(255,255,255,0.78); font-size:0.85rem; font-weight:500; margin:0; }

    .card{
      background:#fff; border:1px solid var(--border); border-radius:16px;
      padding:20px; margin-bottom:18px;
      box-shadow: 0 1px 2px rgba(40,19,65,0.04), 0 14px 30px -18px rgba(40,19,65,0.3);
    }
    h1,h2,h3{ margin-top:0; font-family:'Cairo',sans-serif; color: var(--ink); }
    h1{ font-size:1.15rem; font-weight:800; }
    h2{ font-size:1.02rem; font-weight:800; }
    h3{ font-size:0.95rem; font-weight:700; color: var(--ink); }

    input,button{ font:inherit; }
    input[type=password], input[type=search]{
      width:100%; box-sizing:border-box; padding:0.7rem 0.85rem;
      border:1.5px solid var(--border); border-radius:10px; background:#fff; color: var(--text);
      transition: border-color .15s ease, box-shadow .15s ease;
    }
    input[type=password]:focus, input[type=search]:focus{
      outline:none; border-color: var(--ink); box-shadow: 0 0 0 3px rgba(58,33,88,0.12);
    }

    button{
      border:0; border-radius:10px; padding:0.65rem 1rem; cursor:pointer; margin:4px;
      font-weight:700; font-size:0.88rem;
      transition: transform .12s ease, box-shadow .12s ease, background .15s ease;
    }
    button:active{ transform: scale(0.98); }
    .primary{ background: var(--ink); color:#fff; box-shadow: 0 10px 20px -10px rgba(58,33,88,0.55); }
    .primary:hover{ background: var(--ink-dark); }
    .secondary{ background:#fff; color: var(--ink); border:1.5px solid var(--border); }
    .secondary:hover{ background:#faf9fc; }
    .danger{ background: var(--danger); color:#fff; box-shadow: 0 10px 20px -10px rgba(185,28,28,0.45); }
    .danger:hover{ background:#991b1b; }

    .hidden{ display:none!important; }

    .msg{
      padding:0.7rem 0.85rem; border-radius:10px; background: var(--info-bg);
      border:1px solid var(--info-border); color: var(--info-text);
      margin-top:10px; font-size:0.85rem; font-weight:600; line-height:1.6;
    }
    .error{ background: var(--danger-bg); border-color: var(--danger-border); color: var(--danger); }
    .ok{ background: var(--success-bg); border-color:#cdeade; color: var(--success); }

    .toolbar{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
    .toolbar input{ flex:1; min-width:220px; }

    .folders{ display:flex; flex-direction:column; gap:8px; }
    .folders button{
      display:flex; align-items:center; gap:0.6rem;
      width:100%; text-align:right; background:#faf9fc;
      border:1px solid var(--border); border-radius:12px; padding:0.7rem 0.9rem;
      color: var(--text); font-weight:700; font-size:0.88rem; margin:0;
      transition: border-color .15s ease, background .15s ease;
    }
    .folders button::before{ content:"📁"; font-size:1rem; }
    .folders button:hover{ background:#f1edf9; border-color: var(--ink-soft); }

    .grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:10px; }
    .field{
      position:relative; border:1px solid #e5dcef; border-radius:16px;
      padding:0.9rem 0.95rem; background:linear-gradient(145deg,#ffffff,#f8f5fc);
      box-shadow:0 5px 16px rgba(58,33,88,.06), inset 0 1px 0 rgba(255,255,255,.9);
      overflow:hidden; transition:transform .16s ease, box-shadow .16s ease, border-color .16s ease;
    }
    .field::before{
      content:""; position:absolute; top:0; right:0; width:4px; height:100%;
      background:linear-gradient(180deg,var(--brass),#d9b86e); opacity:.9;
    }
    .field:hover{
      transform:translateY(-2px); border-color:#d7c9e8;
      box-shadow:0 10px 24px rgba(58,33,88,.10);
    }
    .field-top{ display:flex; align-items:center; justify-content:space-between; gap:0.55rem; margin-bottom:0.45rem; }
    .field-top .label{ margin-bottom:0; }
    .copy-btn{
      flex-shrink:0; width:34px; height:34px; padding:0; margin:0;
      border-radius:999px; background:linear-gradient(145deg,#f7f3fb,#e9e1f5);
      border:1px solid #ddd1ed; color:var(--ink); line-height:1;
      display:inline-flex; align-items:center; justify-content:center;
      cursor:pointer; box-shadow:0 3px 9px rgba(58,33,88,.12), inset 0 1px 0 rgba(255,255,255,.85);
      transition:transform .15s ease, box-shadow .15s ease, background .15s ease, color .15s ease;
    }
    .copy-btn svg{ width:16px; height:16px; display:block; }
    .copy-btn:hover{ transform:translateY(-1px); background:linear-gradient(145deg,#fff,#efe8f8); box-shadow:0 6px 14px rgba(58,33,88,.18); }
    .copy-btn:active{ transform:scale(.93); }
    .copy-btn.copied{ background:linear-gradient(145deg,#eefaf4,#dff3e8); border-color:#bfe3cf; color:var(--success); }
    .copy-btn.copy-failed{ background:linear-gradient(145deg,#fff4f3,#fde8e6); border-color:var(--danger-border); color:var(--danger); }

    .file-actions{ white-space:nowrap; }
    .file-actions a, .file-actions button{
      display:inline-flex; align-items:center; justify-content:center; gap:6px;
      margin:2px; padding:.48rem .75rem; border-radius:9px;
      border:1px solid var(--border); text-decoration:none; font-weight:800; font-size:.78rem;
      cursor:pointer; transition:transform .12s ease, box-shadow .15s ease, background .15s ease;
    }
    .file-actions a.open-btn{ background:#efe9f7; color:var(--ink); }
    .file-actions a.open-btn:hover{ background:#e5dcf1; transform:translateY(-1px); }
    .file-actions button.download-btn{ background:var(--ink); color:#fff; border-color:var(--ink); box-shadow:0 5px 12px rgba(58,33,88,.18); }
    .file-actions button.download-btn:hover{ background:var(--ink-dark); transform:translateY(-1px); box-shadow:0 7px 16px rgba(58,33,88,.25); }
    .file-actions button.download-btn:disabled{ opacity:.65; cursor:wait; transform:none; }
    .file-actions svg{ width:15px; height:15px; flex:0 0 auto; }
    .pdf-all-btn{
      display:inline-flex; align-items:center; justify-content:center; gap:8px;
      background:linear-gradient(135deg,#5b2a86,#3a2158); color:#fff;
      border:1px solid #4a266d; border-radius:12px; padding:.68rem 1rem;
      box-shadow:0 8px 18px rgba(58,33,88,.22);
      font-weight:800; margin:4px; cursor:pointer;
    }
    .pdf-all-btn:hover{ transform:translateY(-1px); box-shadow:0 11px 22px rgba(58,33,88,.28); }
    .pdf-all-btn:disabled{ opacity:.7; cursor:wait; transform:none; }
    .pdf-all-btn svg{ width:18px; height:18px; flex:0 0 auto; }

    .label{
      font-weight:800; color:#705b8f; font-size:0.74rem; margin-bottom:0;
      letter-spacing:.01em;
    }
    .value{
      word-break:break-word; font-weight:700; color:#2b1d3d; font-size:0.92rem;
      line-height:1.65; padding:0.5rem 0.65rem; border-radius:10px;
      background:rgba(243,239,249,.72); border:1px solid #eee8f5;
    }

    table{ width:100%; border-collapse:collapse; border:1px solid var(--border); border-radius:12px; overflow:hidden; }
    thead tr{ background: linear-gradient(180deg,#efe9f7,#e9e1f5); }
    th{ padding:0.65rem 0.75rem; text-align:right; font-size:0.8rem; color: var(--ink); font-weight:800; }
    td{ padding:0.65rem 0.75rem; border-top:1px solid var(--border); text-align:right; font-size:0.86rem; color: var(--text); }
    tbody tr:hover{ background:#faf8fd; }

    .file-actions a{
      display:inline-block; margin:2px; padding:0.4rem 0.7rem;
      background:#efe9f7; border:1px solid var(--border); border-radius:8px;
      color: var(--ink); text-decoration:none; font-weight:700; font-size:0.78rem;
      transition: background .15s ease;
    }
    .file-actions a:hover{ background: var(--brass-light); }

    .small{ font-size:0.78rem; color: var(--muted); }

    /* ---- بطاقة الدخول (مركزة وضيقة) ---- */
    #loginCard{ max-width:420px; margin: 6px auto 18px; text-align:center; }
    .login-icon{
      width:56px; height:56px; border-radius:9999px; margin:0 auto 12px;
      background: var(--ink); color:#fff; display:flex; align-items:center; justify-content:center; font-size:1.5rem;
    }
    #loginCard p.small{ margin-bottom:14px; }
    #loginCard input{ margin-bottom:4px; }
    #loginCard button.primary{ width:100%; margin-top:10px; padding:0.75rem 1rem; }
  </style>
</head>

<body>
<div class="wrap">

  <div class="admin-header">
    <div class="admin-header-inner">
      <div class="admin-emblem">
        <img src="https://lh3.googleusercontent.com/d/1VFs1bJppqJNtfuB3nyWNJM54cj2SYPp5" alt="شعار المدرسة">
      </div>
      <h1>لوحة إدارة استمارات الكادر</h1>
      <p>ثانوية الشهيد محمد عبدالعزيز الكنعان للبنين</p>
    </div>
  </div>

  <section id="loginCard" class="card">
    <div class="login-icon">🔒</div>
    <h1>دخول الإدارة</h1>
    <p class="small">الوصول مخصص للمستخدم الإداري المصرح له.</p>
    <input id="password" type="password" autocomplete="current-password" placeholder="كلمة مرور الإدارة">
    <div style="margin-top:12px">
      <div id="turnstileBox"></div>
    </div>
    <button id="loginBtn" class="primary" onclick="login()">دخول</button>
    <div id="loginMsg"></div>
  </section>

  <section id="app" class="hidden">
    <div class="card">
      <div class="toolbar">
        <input id="search" type="search" placeholder="بحث باسم الموظف أو رقم البطاقة الموحدة..." oninput="filterFolders()">
        <button class="secondary" onclick="loadFolders()">↻ تحديث</button>
        <button class="secondary" onclick="exportAllExcel()">⬇️ Excel — جميع الموظفين</button>
        <button class="danger" onclick="logout()">خروج</button>
      </div>
    </div>

    <div class="card">
      <h2>الموظفون</h2>
      <div id="folders" class="folders"></div>
    </div>

    <div id="detailsCard" class="card hidden">
      <div class="toolbar">
        <h2 id="detailsTitle" style="flex:1"></h2>
        <button class="secondary" onclick="exportOneExcel()">⬇️ Excel — هذا الموظف</button>
        <button id="pdfAllBtn" class="pdf-all-btn" type="button" onclick="exportOnePdf()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M6 2h9l4 4v16H6z"/><path d="M15 2v5h5"/><path d="M9 13h6"/><path d="M9 17h6"/><path d="M9 9h2"/>
          </svg>
          تحميل جميع المستمسكات PDF
        </button>
      </div>
      <div id="details"></div>
    </div>
  </section>
</div>

<script>
const WORKER_URL = "https://small-thunder-126d.hassanfaleh2018.workers.dev/";
const TURNSTILE_SITE_KEY = "0x4AAAAAAFE7bJsaCVZW-qxQ";

let session = sessionStorage.getItem("adminSession") || "";
let allFolders = [];
let currentEmployeeData = null;
let turnstileWidgetId = null;

const labels = {
  referenceNumber:"رقم الاستمارة",
  fullName:"الاسم الرباعي",
  employeeType:"نوع الموظف",
  title:"اللقب",
  firstName:"الاسم",
  fatherName:"اسم الأب",
  grandfatherName:"اسم الجد",
  familyName:"اللقب العائلي",
  dob:"تاريخ التولد",
  birthDate:"تاريخ التولد",
  birthPlace:"محل التولد",
  gender:"الجنس",
  idNumber:"رقم البطاقة الموحدة",
  nationalId:"رقم البطاقة الموحدة",
  cardNumber:"رقم البطاقة",
  motherName:"اسم الأم",
  bloodType:"فصيلة الدم",
  socialStatus:"الحالة الاجتماعية",
  maritalStatus:"الحالة الاجتماعية",
  religion:"الديانة",
  jobTitle:"العنوان الوظيفي",
  jobStatus:"الحالة الوظيفية",
  jobStatusOther:"تفاصيل الحالة الوظيفية",
  qualification:"التحصيل الدراسي",
  college:"الكلية",
  specialization:"الاختصاص",
  gradDate:"تاريخ التخرج",
  graduationDate:"تاريخ التخرج",
  firstAppDate:"تاريخ أول تعيين",
  phone:"رقم الهاتف",
  mobile:"رقم الهاتف",
  address:"عنوان السكن",
  landmark:"أقرب نقطة دالة",
  governorate:"المحافظة",
  district:"القضاء",
  university:"الجامعة",
  department:"القسم",
  school:"المدرسة",
  notes:"ملاحظات",
  createdAt:"تاريخ الإرسال"
};

const fileLabels = {
  idFront:"الوجه الأمامي للبطاقة الموحدة",
  idBack:"الوجه الخلفي للبطاقة الموحدة",
  personalPhoto:"الصورة الشخصية",
  gradDoc:"وثيقة التخرج",
  adminOrder:"الأمر الإداري",
  commencementOrder:"أمر المباشرة",
  submissionData:"بيانات الاستمارة"
};

function setMsg(el, text, type="") {
  el.className = "msg " + type;
  el.textContent = text || "";
}

function mountTurnstile() {
  if (TURNSTILE_SITE_KEY === "PUT_YOUR_TURNSTILE_SITE_KEY_HERE") {
    setMsg(document.getElementById("loginMsg"),
      "ضع Site Key الخاص بـ Turnstile داخل المتغير TURNSTILE_SITE_KEY أولًا.", "error");
    return;
  }
  if (!window.turnstile) {
    setTimeout(mountTurnstile, 500);
    return;
  }
  if (turnstileWidgetId !== null) return;

  turnstileWidgetId = turnstile.render("#turnstileBox", {
    sitekey: TURNSTILE_SITE_KEY,
    theme: "light",
    callback: () => {},
    "expired-callback": () => {}
  });
}

async function login() {
  const msg = document.getElementById("loginMsg");
  const password = document.getElementById("password").value;

  if (!password) {
    setMsg(msg, "أدخل كلمة المرور.", "error");
    return;
  }
  if (!window.turnstile || turnstileWidgetId === null) {
    setMsg(msg, "تحقق من إعداد Turnstile أولًا.", "error");
    return;
  }

  const turnstileToken = turnstile.getResponse(turnstileWidgetId);
  if (!turnstileToken) {
    setMsg(msg, "أكمل التحقق الأمني أولًا.", "error");
    return;
  }

  try {
    const r = await fetch(WORKER_URL + "?action=login", {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({password, turnstileToken})
    });
    const data = await r.json();

    if (!r.ok || !data.ok) {
      setMsg(msg, data.error || "تعذر تسجيل الدخول.", "error");
      turnstile.reset(turnstileWidgetId);
      return;
    }

    session = data.session;
    sessionStorage.setItem("adminSession", session);
    document.getElementById("loginCard").classList.add("hidden");
    document.getElementById("app").classList.remove("hidden");
    await loadFolders();
  } catch (e) {
    setMsg(msg, "تعذر الاتصال بالخادم.", "error");
  }
}

function logout() {
  session = "";
  sessionStorage.removeItem("adminSession");
  currentEmployeeData = null;
  document.getElementById("app").classList.add("hidden");
  document.getElementById("loginCard").classList.remove("hidden");
  document.getElementById("password").value = "";
  if (window.turnstile && turnstileWidgetId !== null) turnstile.reset(turnstileWidgetId);
}

async function apiGet(action, params={}) {
  const qs = new URLSearchParams({action, ...params});
  const r = await fetch(WORKER_URL + "?" + qs.toString(), {
    headers: {"Authorization":"Bearer " + session}
  });

  if (r.status === 401) {
    logout();
    throw new Error("انتهت جلسة الإدارة.");
  }

  const data = await r.json();
  if (!r.ok) throw new Error(data.error || "فشل الطلب.");
  return data;
}

async function loadFolders() {
  const box = document.getElementById("folders");
  box.innerHTML = "جاري التحميل...";
  try {
    const data = await apiGet("adminList");
    allFolders = data.folders || [];
    renderFolders(allFolders);
  } catch (e) {
    box.innerHTML = `<div class="msg error">${escapeHtml(e.message)}</div>`;
  }
}

function filterFolders() {
  const q = document.getElementById("search").value.trim().toLowerCase();
  renderFolders(allFolders.filter(x => x.toLowerCase().includes(q)));
}

function renderFolders(list) {
  const box = document.getElementById("folders");
  if (!list.length) {
    box.innerHTML = '<div class="small">لا توجد نتائج.</div>';
    return;
  }
  box.innerHTML = "";
  for (const folder of list) {
    const b = document.createElement("button");
    b.textContent = folder;
    b.onclick = () => showEmployee(folder);
    box.appendChild(b);
  }
}

async function showEmployee(folder) {
  const card = document.getElementById("detailsCard");
  const details = document.getElementById("details");
  card.classList.remove("hidden");
  details.innerHTML = "جاري تحميل بيانات الموظف...";
  document.getElementById("detailsTitle").textContent = folder;

  try {
    currentEmployeeData = await apiGet("adminDetails", {folder});
    renderEmployee(currentEmployeeData);
    card.scrollIntoView({behavior:"smooth"});
  } catch (e) {
    details.innerHTML = `<div class="msg error">${escapeHtml(e.message)}</div>`;
  }
}

function renderEmployee(data) {
  const metadata = data.metadata || {};
  const details = document.getElementById("details");

  let html = '<h3>بيانات الاستمارة</h3><div class="grid">';
  for (const [key, value] of Object.entries(metadata)) {
    if (!(key in labels)) continue;
    if (value === null || value === undefined || value === "") continue;
    const displayValue = formatValue(value);
    html += `<div class="field">
      <div class="field-top">
        <div class="label">${escapeHtml(labels[key])}</div>
        <button type="button" class="copy-btn" onclick="copyFieldValue(this)" data-value="${escapeAttr(displayValue)}" title="نسخ القيمة" aria-label="نسخ القيمة">${copyIconSvg()}</button>
      </div>
      <div class="value">${escapeHtml(displayValue)}</div>
    </div>`;
  }
  html += "</div>";

  html += '<h3 style="margin-top:25px">المستمسكات</h3>';
  html += '<table><thead><tr><th>المستمسك</th><th>الحجم</th><th>الإجراء</th></tr></thead><tbody>';

  for (const file of (data.files || [])) {
    const label = fileLabels[file.key] || detectArabicFileLabel(file.name);
    html += `<tr>
      <td>${escapeHtml(label)}</td>
      <td>${formatBytes(file.size)}</td>
      <td class="file-actions">
        <a class="open-btn" href="${escapeAttr(file.url)}" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M14 3h7v7"/><path d="M10 14 21 3"/><path d="M21 14v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5"/></svg>
          فتح
        </a>
        <button type="button" class="download-btn" data-url="${escapeAttr(file.url)}" data-name="${escapeAttr(file.name || label)}" onclick="downloadFile(this)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>
          تحميل PDF
        </button>
      </td>
    </tr>`;
  }

  html += "</tbody></table>";
  details.innerHTML = html;
}

function detectArabicFileLabel(name) {
  for (const [key, label] of Object.entries(fileLabels)) {
    if (name.includes(label.replaceAll(" ", "_"))) return label;
  }
  return "مرفق";
}

function formatValue(v) {
  if (typeof v === "object") return JSON.stringify(v, null, 2);
  return String(v);
}

function formatBytes(n) {
  if (!n) return "0 بايت";
  const units = ["بايت","KB","MB","GB"];
  let i = 0, x = n;
  while (x >= 1024 && i < units.length - 1) { x /= 1024; i++; }
  return x.toFixed(i ? 2 : 0) + " " + units[i];
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
  }[c]));
}

function escapeAttr(s) {
  return escapeHtml(s);
}

function copyIconSvg(){
  return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M15 9V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h3"/></svg>`;
}

function checkIconSvg(){
  return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 4 4L19 6"/></svg>`;
}

function warningIconSvg(){
  return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 9v4"/><path d="M12 17h.01"/><path d="M10.3 3.6 2.1 18a2 2 0 0 0 1.7 3h16.4a2 2 0 0 0 1.7-3L13.7 3.6a2 2 0 0 0-3.4 0Z"/></svg>`;
}

function copyFieldValue(btn) {
  const value = btn.getAttribute("data-value") || "";
  const original = btn.innerHTML;
  const finish = (ok) => {
    btn.innerHTML = ok ? checkIconSvg() : warningIconSvg();
    btn.classList.add(ok ? "copied" : "copy-failed");
    btn.title = ok ? "تم النسخ" : "تعذر النسخ";
    setTimeout(() => {
      btn.innerHTML = original;
      btn.title = "نسخ القيمة";
      btn.classList.remove("copied", "copy-failed");
    }, 1200);
  };

  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(value).then(() => finish(true)).catch(() => finish(false));
    return;
  }

  try {
    const ta = document.createElement("textarea");
    ta.value = value;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    const ok = document.execCommand("copy");
    document.body.removeChild(ta);
    finish(ok);
  } catch (e) {
    finish(false);
  }
}

function arabicRow(metadata) {
  const row = {};
  for (const [key, value] of Object.entries(metadata || {})) {
    if (labels[key] && value !== null && value !== undefined && value !== "") {
      row[labels[key]] = typeof value === "object" ? JSON.stringify(value) : value;
    }
  }
  return row;
}

async function downloadFile(btn) {
  const url = btn.getAttribute("data-url") || "";
  const filename = btn.getAttribute("data-name") || "مرفق.pdf";
  if (!url) return;

  const original = btn.innerHTML;
  btn.disabled = true;
  btn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg> جاري التحميل...`;

  try {
    const response = await fetch(url, {method:"GET", mode:"cors", cache:"no-store"});
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    const blob = await response.blob();
    downloadBlob(blob, filename);
  } catch (e) {
    console.error("Download failed:", e);
    alert("تعذر تحميل المستمسك. أعد فتح بيانات الموظف ثم حاول مرة أخرى. إذا استمرت المشكلة تأكد من إعداد CORS في R2.");
  } finally {
    btn.disabled = false;
    btn.innerHTML = original;
  }
}

function downloadBlob(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  a.style.display = "none";
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function safeFilename(s) {
  return String(s || "موظف").replace(/[\\/:*?"<>|]/g, "_").slice(0, 120);
}

function exportOneExcel() {
  if (!currentEmployeeData) return;
  const row = arabicRow(currentEmployeeData.metadata);
  row["مجلد الموظف"] = currentEmployeeData.folder;

  const ws = XLSX.utils.json_to_sheet([row]);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "بيانات الموظف");
  XLSX.writeFile(wb, safeFilename(currentEmployeeData.folder) + ".xlsx");
}

async function exportAllExcel() {
  try {
    const data = await apiGet("adminExportData");
    const rows = (data.records || []).map(r => {
      const row = arabicRow(r.metadata);
      row["مجلد الموظف"] = r.folder;
      return row;
    });

    if (!rows.length) {
      alert("لا توجد بيانات.");
      return;
    }

    const ws = XLSX.utils.json_to_sheet(rows);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "جميع الموظفين");
    XLSX.writeFile(wb, "بيانات_جميع_الموظفين.xlsx");
  } catch (e) {
    alert(e.message);
  }
}

async function fetchBytes(url) {
  const r = await fetch(url);
  if (!r.ok) throw new Error("تعذر تحميل أحد المستندات.");
  return new Uint8Array(await r.arrayBuffer());
}

async function exportOnePdf() {
  if (!currentEmployeeData) return;

  const btn = document.getElementById("pdfAllBtn");
  const original = btn ? btn.innerHTML : "";
  if (btn) {
    btn.disabled = true;
    btn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/>
    </svg> جاري تجهيز PDF...`;
  }

  try {
    const { PDFDocument } = PDFLib;
    const out = await PDFDocument.create();

    // لا نضيف صفحة تعريفية نصية هنا؛ pdf-lib يستخدم WinAnsi
    // مع الخطوط القياسية، وهذا يسبب خطأ عند رسم النص العربي.
    // اسم الموظف العربي سيبقى محفوظاً في اسم الملف الناتج نفسه.

    let addedCount = 0;
    let skippedCount = 0;

    for (const file of (currentEmployeeData.files || [])) {
      if (file.key === "submissionData") continue;

      try {
        const bytes = await fetchBytes(file.url);
        const lower = String(file.name || "").toLowerCase();

        if (lower.endsWith(".pdf")) {
          const src = await PDFDocument.load(bytes);
          const pages = await out.copyPages(src, src.getPageIndices());
          pages.forEach(page => out.addPage(page));
          addedCount += pages.length;
        } else if (lower.endsWith(".jpg") || lower.endsWith(".jpeg")) {
          const img = await out.embedJpg(bytes);
          addImagePage(out, img);
          addedCount++;
        } else if (lower.endsWith(".png")) {
          const img = await out.embedPng(bytes);
          addImagePage(out, img);
          addedCount++;
        } else {
          // HEIC/HEIF/WebP لا يدعمها pdf-lib مباشرة
          skippedCount++;
        }
      } catch (e) {
        console.warn("Skipped file:", file.name, e);
        skippedCount++;
      }
    }

    if (addedCount === 0) {
      throw new Error("لم يتم العثور على مستمسكات قابلة للدمج داخل PDF.");
    }

    const pdfBytes = await out.save();
    downloadBlob(
      new Blob([pdfBytes], {type:"application/pdf"}),
      safeFilename(currentEmployeeData.folder) + "_جميع_المستمسكات.pdf"
    );

    if (skippedCount > 0) {
      setTimeout(() => {
        alert("تم إنشاء PDF بنجاح، لكن بعض الملفات غير المدعومة مثل HEIC/HEIF أو WebP لم تُضمّن.");
      }, 300);
    }
  } catch (e) {
    console.error("PDF export failed:", e);
    alert(e.message || "تعذر إنشاء ملف PDF.");
  } finally {
    if (btn) {
      btn.disabled = false;
      btn.innerHTML = original;
    }
  }
}

function addImagePage(pdf, image) {
  const iw = image.width, ih = image.height;
  const maxW = 535, maxH = 760;
  const scale = Math.min(maxW / iw, maxH / ih, 1);
  const w = iw * scale, h = ih * scale;
  const page = pdf.addPage([595, 842]);
  page.drawImage(image, {
    x:(595-w)/2,
    y:(842-h)/2,
    width:w,
    height:h
  });
}

if (session) {
  document.getElementById("loginCard").classList.add("hidden");
  document.getElementById("app").classList.remove("hidden");
  loadFolders().catch(() => logout());
} else {
  mountTurnstile();
}
