<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>إدارة استمارات الموظفين</title>

  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>

  <style>
    body{font-family:Arial,Tahoma,sans-serif;background:#f5f7fa;margin:0;color:#17202a}
    .wrap{max-width:1200px;margin:30px auto;padding:0 16px}
    .card{background:#fff;border-radius:14px;padding:20px;margin-bottom:18px;box-shadow:0 3px 15px #00000012}
    h1,h2{margin-top:0}
    input,button{font:inherit}
    input[type=password],input[type=search]{width:100%;box-sizing:border-box;padding:12px;border:1px solid #ccd3da;border-radius:9px}
    button{border:0;border-radius:9px;padding:10px 14px;cursor:pointer;margin:4px}
    .primary{background:#166534;color:#fff}.secondary{background:#e9eef3}.danger{background:#b91c1c;color:#fff}
    .hidden{display:none!important}
    .msg{padding:10px;border-radius:9px;background:#eef4ff;margin-top:10px}
    .error{background:#fee2e2;color:#991b1b}.ok{background:#dcfce7;color:#166534}
    .toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
    .toolbar input{flex:1;min-width:220px}
    .folders button{display:block;width:100%;text-align:right;background:#f8fafc;border:1px solid #e2e8f0}
    .folders button:hover{background:#eef4ff}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:10px}
    .field{border:1px solid #e5e7eb;border-radius:10px;padding:10px;background:#fafafa}
    .label{font-weight:bold;color:#475569;margin-bottom:5px}
    .value{word-break:break-word}
    table{width:100%;border-collapse:collapse}
    th,td{padding:9px;border-bottom:1px solid #e5e7eb;text-align:right}
    .file-actions a{display:inline-block;margin:3px;padding:7px 9px;background:#e2e8f0;border-radius:7px;color:#111;text-decoration:none}
    .small{font-size:12px;color:#64748b}
  </style>
</head>

<body>
<div class="wrap">

  <section id="loginCard" class="card">
    <h1>دخول الإدارة</h1>
    <p class="small">الوصول مخصص للمستخدم الإداري المصرح له.</p>
    <input id="password" type="password" autocomplete="current-password" placeholder="كلمة مرور الإدارة">
    <div style="margin-top:12px">
      <div id="turnstileBox"></div>
    </div>
    <button id="loginBtn" class="primary" onclick="login()">دخول</button>
    <div id="loginMsg"></div>
  </section>

  <section id="app" class="hidden">
    <div class="card">
      <div class="toolbar">
        <input id="search" type="search" placeholder="بحث باسم الموظف أو رقم البطاقة الموحدة..." oninput="filterFolders()">
        <button class="primary" onclick="loadFolders()">تحديث</button>
        <button class="secondary" onclick="exportAllExcel()">⬇️ Excel — جميع الموظفين</button>
        <button class="danger" onclick="logout()">خروج</button>
      </div>
    </div>

    <div class="card">
      <h2>الموظفون</h2>
      <div id="folders" class="folders"></div>
    </div>

    <div id="detailsCard" class="card hidden">
      <div class="toolbar">
        <h2 id="detailsTitle" style="flex:1"></h2>
        <button class="secondary" onclick="exportOneExcel()">⬇️ Excel — هذا الموظف</button>
        <button class="primary" onclick="exportOnePdf()">📄 PDF — مستمسكات هذا الموظف</button>
      </div>
      <div id="details"></div>
    </div>
  </section>
</div>

<script>
const WORKER_URL = "https://small-thunder-126d.hassanfaleh2018.workers.dev/";
const TURNSTILE_SITE_KEY = "0x4AAAAAAFE7bJsaCVZW-qxQ";

let session = sessionStorage.getItem("adminSession") || "";
let allFolders = [];
let currentEmployeeData = null;
let turnstileWidgetId = null;

const labels = {
  referenceNumber:"رقم الاستمارة",
  fullName:"الاسم الرباعي",
  employeeType:"نوع الموظف",
  title:"اللقب",
  firstName:"الاسم",
  fatherName:"اسم الأب",
  grandfatherName:"اسم الجد",
  familyName:"اللقب العائلي",
  dob:"تاريخ التولد",
  birthDate:"تاريخ التولد",
  birthPlace:"محل التولد",
  gender:"الجنس",
  idNumber:"رقم البطاقة الموحدة",
  nationalId:"رقم البطاقة الموحدة",
  cardNumber:"رقم البطاقة",
  motherName:"اسم الأم",
  bloodType:"فصيلة الدم",
  socialStatus:"الحالة الاجتماعية",
  maritalStatus:"الحالة الاجتماعية",
  religion:"الديانة",
  jobTitle:"العنوان الوظيفي",
  jobStatus:"الحالة الوظيفية",
  jobStatusOther:"تفاصيل الحالة الوظيفية",
  qualification:"التحصيل الدراسي",
  college:"الكلية",
  specialization:"الاختصاص",
  gradDate:"تاريخ التخرج",
  graduationDate:"تاريخ التخرج",
  firstAppDate:"تاريخ أول تعيين",
  phone:"رقم الهاتف",
  mobile:"رقم الهاتف",
  address:"عنوان السكن",
  landmark:"أقرب نقطة دالة",
  governorate:"المحافظة",
  district:"القضاء",
  university:"الجامعة",
  department:"القسم",
  school:"المدرسة",
  notes:"ملاحظات",
  createdAt:"تاريخ الإرسال"
};

const fileLabels = {
  idFront:"الوجه الأمامي للبطاقة الموحدة",
  idBack:"الوجه الخلفي للبطاقة الموحدة",
  personalPhoto:"الصورة الشخصية",
  gradDoc:"وثيقة التخرج",
  adminOrder:"الأمر الإداري",
  commencementOrder:"أمر المباشرة",
  submissionData:"بيانات الاستمارة"
};

function setMsg(el, text, type="") {
  el.className = "msg " + type;
  el.textContent = text || "";
}

function mountTurnstile() {
  if (TURNSTILE_SITE_KEY === "PUT_YOUR_TURNSTILE_SITE_KEY_HERE") {
    setMsg(document.getElementById("loginMsg"),
      "ضع Site Key الخاص بـ Turnstile داخل المتغير TURNSTILE_SITE_KEY أولًا.", "error");
    return;
  }
  if (!window.turnstile) {
    setTimeout(mountTurnstile, 500);
    return;
  }
  if (turnstileWidgetId !== null) return;

  turnstileWidgetId = turnstile.render("#turnstileBox", {
    sitekey: TURNSTILE_SITE_KEY,
    theme: "light",
    callback: () => {},
    "expired-callback": () => {}
  });
}

async function login() {
  const msg = document.getElementById("loginMsg");
  const password = document.getElementById("password").value;

  if (!password) {
    setMsg(msg, "أدخل كلمة المرور.", "error");
    return;
  }
  if (!window.turnstile || turnstileWidgetId === null) {
    setMsg(msg, "تحقق من إعداد Turnstile أولًا.", "error");
    return;
  }

  const turnstileToken = turnstile.getResponse(turnstileWidgetId);
  if (!turnstileToken) {
    setMsg(msg, "أكمل التحقق الأمني أولًا.", "error");
    return;
  }

  try {
    const r = await fetch(WORKER_URL + "?action=login", {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({password, turnstileToken})
    });
    const data = await r.json();

    if (!r.ok || !data.ok) {
      setMsg(msg, data.error || "تعذر تسجيل الدخول.", "error");
      turnstile.reset(turnstileWidgetId);
      return;
    }

    session = data.session;
    sessionStorage.setItem("adminSession", session);
    document.getElementById("loginCard").classList.add("hidden");
    document.getElementById("app").classList.remove("hidden");
    await loadFolders();
  } catch (e) {
    setMsg(msg, "تعذر الاتصال بالخادم.", "error");
  }
}

function logout() {
  session = "";
  sessionStorage.removeItem("adminSession");
  currentEmployeeData = null;
  document.getElementById("app").classList.add("hidden");
  document.getElementById("loginCard").classList.remove("hidden");
  document.getElementById("password").value = "";
  if (window.turnstile && turnstileWidgetId !== null) turnstile.reset(turnstileWidgetId);
}

async function apiGet(action, params={}) {
  const qs = new URLSearchParams({action, ...params});
  const r = await fetch(WORKER_URL + "?" + qs.toString(), {
    headers: {"Authorization":"Bearer " + session}
  });

  if (r.status === 401) {
    logout();
    throw new Error("انتهت جلسة الإدارة.");
  }

  const data = await r.json();
  if (!r.ok) throw new Error(data.error || "فشل الطلب.");
  return data;
}

async function loadFolders() {
  const box = document.getElementById("folders");
  box.innerHTML = "جاري التحميل...";
  try {
    const data = await apiGet("adminList");
    allFolders = data.folders || [];
    renderFolders(allFolders);
  } catch (e) {
    box.innerHTML = `<div class="msg error">${escapeHtml(e.message)}</div>`;
  }
}

function filterFolders() {
  const q = document.getElementById("search").value.trim().toLowerCase();
  renderFolders(allFolders.filter(x => x.toLowerCase().includes(q)));
}

function renderFolders(list) {
  const box = document.getElementById("folders");
  if (!list.length) {
    box.innerHTML = '<div class="small">لا توجد نتائج.</div>';
    return;
  }
  box.innerHTML = "";
  for (const folder of list) {
    const b = document.createElement("button");
    b.textContent = folder;
    b.onclick = () => showEmployee(folder);
    box.appendChild(b);
  }
}

async function showEmployee(folder) {
  const card = document.getElementById("detailsCard");
  const details = document.getElementById("details");
  card.classList.remove("hidden");
  details.innerHTML = "جاري تحميل بيانات الموظف...";
  document.getElementById("detailsTitle").textContent = folder;

  try {
    currentEmployeeData = await apiGet("adminDetails", {folder});
    renderEmployee(currentEmployeeData);
    card.scrollIntoView({behavior:"smooth"});
  } catch (e) {
    details.innerHTML = `<div class="msg error">${escapeHtml(e.message)}</div>`;
  }
}

function renderEmployee(data) {
  const metadata = data.metadata || {};
  const details = document.getElementById("details");

  let html = '<h3>بيانات الاستمارة</h3><div class="grid">';
  for (const [key, value] of Object.entries(metadata)) {
    if (!(key in labels)) continue;
    if (value === null || value === undefined || value === "") continue;
    html += `<div class="field"><div class="label">${escapeHtml(labels[key])}</div><div class="value">${escapeHtml(formatValue(value))}</div></div>`;
  }
  html += "</div>";

  html += '<h3 style="margin-top:25px">المستمسكات</h3>';
  html += '<table><thead><tr><th>المستمسك</th><th>الحجم</th><th>الإجراء</th></tr></thead><tbody>';

  for (const file of (data.files || [])) {
    const label = fileLabels[file.key] || detectArabicFileLabel(file.name);
    html += `<tr>
      <td>${escapeHtml(label)}</td>
      <td>${formatBytes(file.size)}</td>
      <td class="file-actions">
        <a href="${escapeAttr(file.url)}" target="_blank" rel="noopener">فتح</a>
        <a href="${escapeAttr(file.url)}" download>تحميل</a>
      </td>
    </tr>`;
  }

  html += "</tbody></table>";
  details.innerHTML = html;
}

function detectArabicFileLabel(name) {
  for (const [key, label] of Object.entries(fileLabels)) {
    if (name.includes(label.replaceAll(" ", "_"))) return label;
  }
  return "مرفق";
}

function formatValue(v) {
  if (typeof v === "object") return JSON.stringify(v, null, 2);
  return String(v);
}

function formatBytes(n) {
  if (!n) return "0 بايت";
  const units = ["بايت","KB","MB","GB"];
  let i = 0, x = n;
  while (x >= 1024 && i < units.length - 1) { x /= 1024; i++; }
  return x.toFixed(i ? 2 : 0) + " " + units[i];
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
  }[c]));
}

function escapeAttr(s) {
  return escapeHtml(s);
}

function arabicRow(metadata) {
  const row = {};
  for (const [key, value] of Object.entries(metadata || {})) {
    if (labels[key] && value !== null && value !== undefined && value !== "") {
      row[labels[key]] = typeof value === "object" ? JSON.stringify(value) : value;
    }
  }
  return row;
}

function downloadBlob(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function safeFilename(s) {
  return String(s || "موظف").replace(/[\\/:*?"<>|]/g, "_").slice(0, 120);
}

function exportOneExcel() {
  if (!currentEmployeeData) return;
  const row = arabicRow(currentEmployeeData.metadata);
  row["مجلد الموظف"] = currentEmployeeData.folder;

  const ws = XLSX.utils.json_to_sheet([row]);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "بيانات الموظف");
  XLSX.writeFile(wb, safeFilename(currentEmployeeData.folder) + ".xlsx");
}

async function exportAllExcel() {
  try {
    const data = await apiGet("adminExportData");
    const rows = (data.records || []).map(r => {
      const row = arabicRow(r.metadata);
      row["مجلد الموظف"] = r.folder;
      return row;
    });

    if (!rows.length) {
      alert("لا توجد بيانات.");
      return;
    }

    const ws = XLSX.utils.json_to_sheet(rows);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "جميع الموظفين");
    XLSX.writeFile(wb, "بيانات_جميع_الموظفين.xlsx");
  } catch (e) {
    alert(e.message);
  }
}

async function fetchBytes(url) {
  const r = await fetch(url);
  if (!r.ok) throw new Error("تعذر تحميل أحد المستندات.");
  return new Uint8Array(await r.arrayBuffer());
}

async function exportOnePdf() {
  if (!currentEmployeeData) return;

  const { PDFDocument, StandardFonts, rgb } = PDFLib;
  const out = await PDFDocument.create();

  // صفحة تعريفية بسيطة. النص العربي لا يُرسم هنا لأن الخط القياسي في pdf-lib
  // لا يدعم تشكيل العربية. الملفات الأصلية نفسها تبقى دون تغيير.
  const cover = out.addPage([595, 842]);
  const font = await out.embedFont(StandardFonts.Helvetica);
  cover.drawText("Employee Documents", {x: 50, y: 780, size: 22, font});
  cover.drawText("Folder: " + currentEmployeeData.folder, {x: 50, y: 750, size: 10, font});
  cover.drawText("Generated from private R2 storage", {x: 50, y: 730, size: 10, font});

  for (const file of (currentEmployeeData.files || [])) {
    if (file.key === "submissionData") continue;

    try {
      const bytes = await fetchBytes(file.url);
      const lower = file.name.toLowerCase();

      if (lower.endsWith(".pdf")) {
        const src = await PDFDocument.load(bytes);
        const pages = await out.copyPages(src, src.getPageIndices());
        pages.forEach(p => out.addPage(p));
      } else if (lower.endsWith(".jpg") || lower.endsWith(".jpeg")) {
        const img = await out.embedJpg(bytes);
        addImagePage(out, img);
      } else if (lower.endsWith(".png")) {
        const img = await out.embedPng(bytes);
        addImagePage(out, img);
      }
      // HEIC/HEIF/WebP are left out because pdf-lib cannot embed them directly.
    } catch (e) {
      console.warn("Skipped file:", file.name, e);
    }
  }

  const pdfBytes = await out.save();
  downloadBlob(new Blob([pdfBytes], {type:"application/pdf"}),
    safeFilename(currentEmployeeData.folder) + "_مستمسكات.pdf");
}

function addImagePage(pdf, image) {
  const iw = image.width, ih = image.height;
  const maxW = 535, maxH = 760;
  const scale = Math.min(maxW / iw, maxH / ih, 1);
  const w = iw * scale, h = ih * scale;
  const page = pdf.addPage([595, 842]);
  page.drawImage(image, {
    x:(595-w)/2,
    y:(842-h)/2,
    width:w,
    height:h
  });
}

if (session) {
  document.getElementById("loginCard").classList.add("hidden");
  document.getElementById("app").classList.remove("hidden");
  loadFolders().catch(() => logout());
} else {
  mountTurnstile();
}
</script>
</body>
</html>
