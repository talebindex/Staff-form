<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>استمارة معلومات الكادر الخاصة بالعقود</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .hidden-section { display: none; }
    .star { color: red; margin-right: 2px; }
  </style>
</head>
<body class="bg-gray-100 font-sans p-2 md:p-6">

  <div class="max-w-2xl mx-auto bg-white p-4 md:p-8 rounded-lg shadow-md border-t-8 border-purple-800">
    
    <div class="text-center mb-6">
      <h1 class="text-2xl font-bold text-purple-900 mb-2">استمارة معلومات الكادر الخاصة بالعقود</h1>
      <p class="text-gray-700 font-semibold text-sm md:text-base">استمارة خاصة لكادر ثانوية الشهيد محمد عبدالعزيز الكنعان للبنين</p>
    </div>

    <form id="mainForm" onsubmit="handleFormSubmit(event)">

      <!-- القسم 1: نوع الكادر -->
      <div id="section1" class="space-y-5">
        <div class="bg-purple-100 p-3 rounded font-bold text-purple-800 text-lg border-r-4 border-purple-800">
          القسم 1 من 3: تحديد نوع الكادر
        </div>
        
        <div>
          <label class="block font-semibold mb-2">نوع الموظف <span class="star">*</span></label>
          <select id="employeeType" class="w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-purple-500" required>
            <option value="">اختر نوع الموظف...</option>
            <option value="مدرس">مدرس</option>
            <option value="موظف">موظف (كاتب / معاون ملاحظ / حارس / حرفي / خدمات)</option>
          </select>
        </div>

        <button type="button" onclick="goToNextFromSection1()" class="w-full bg-purple-700 text-white py-3 rounded-lg hover:bg-purple-800 font-bold transition">التالي</button>
      </div>

      <!-- القسم 2: المدرسين -->
      <div id="section2" class="space-y-4 hidden-section">
        <div class="bg-purple-100 p-3 rounded font-bold text-purple-800 text-lg border-r-4 border-purple-800">
          القسم 2 من 3: استمارة المعلومات الخاصة بالمدرسين
        </div>

        <div><label class="block font-semibold">الاسم الرباعي <span class="star">*</span></label><input type="text" id="fullName2" class="w-full p-2 border rounded"></div>
        <div><label class="block font-semibold">اللقب <span class="star">*</span></label><input type="text" id="title2" class="w-full p-2 border rounded"></div>
        <div><label class="block font-semibold">تاريخ التولّد <span class="star">*</span></label><input type="date" id="dob2" class="w-full p-2 border rounded"></div>
        <div>
          <label class="block font-semibold">الجنس <span class="star">*</span></label>
          <select id="gender2" class="w-full p-2 border rounded"><option value="">اختر...</option><option value="ذكر">ذكر</option><option value="أنثى">أنثى</option></select>
        </div>
        <div><label class="block font-semibold">رقم البطاقة الموحدة <span class="star">*</span></label><input type="text" id="idNumber2" class="w-full p-2 border rounded"></div>
        <div><label class="block font-semibold">الوجه الأمامي للبطاقة الموحدة <span class="star">*</span></label><input type="file" id="idFront2" accept="image/*" class="w-full p-1 border rounded"></div>
        <div><label class="block font-semibold">الوجه الخلفي للبطاقة الموحدة <span class="star">*</span></label><input type="file" id="idBack2" accept="image/*" class="w-full p-1 border rounded"></div>
        <div><label class="block font-semibold">اسم الأم الثلاثي <span class="star">*</span></label><input type="text" id="motherName2" class="w-full p-2 border rounded"></div>
        <div><label class="block font-semibold">صورة شخصية للموظف <span class="star">*</span></label><input type="file" id="personalPhoto2" accept="image/*" class="w-full p-1 border rounded"></div>
        <div>
          <label class="block font-semibold">فصيلة الدم</label>
          <select id="bloodType2" class="w-full p-2 border rounded"><option value="">اختر...</option><option value="A+">A+</option><option value="A-">A-</option><option value="B+">B+</option><option value="B-">B-</option><option value="O+">O+</option><option value="O-">O-</option><option value="AB+">AB+</option><option value="AB-">AB-</option><option value="غير معروف">غير معروف</option></select>
        </div>
        <div>
          <label class="block font-semibold">الحالة الاجتماعية <span class="star">*</span></label>
          <select id="socialStatus2" class="w-full p-2 border rounded"><option value="">اختر...</option><option value="أعزب/عزباء">أعزب / عزباء</option><option value="متزوج/متزوجة">متزوج / متزوجة</option></select>
        </div>
        <div>
          <label class="block font-semibold">الديانة <span class="star">*</span></label>
          <select id="religion2" class="w-full p-2 border rounded"><option value="">اختر...</option><option value="مسلم">مسلم</option><option value="مسيحي">مسيحي</option><option value="صابئي">صابئي</option><option value="إيزيدي">إيزيدي</option><option value="أخرى">أخرى</option></select>
        </div>
        <div><label class="block font-semibold">الحالة الوظيفية <span class="star">*</span></label><input type="text" id="jobStatus2" placeholder="مستمر / إجازة..." class="w-full p-2 border rounded"></div>
        <div><label class="block font-semibold">التحصيل الدراسي <span class="star">*</span></label><input type="text" id="qualification2" class="w-full p-2 border rounded"></div>
        <div><label class="block font-semibold">إسم الكلية / المعهد <span class="star">*</span></label><input type="text" id="college2" class="w-full p-2 border rounded"></div>
        <div><label class="block font-semibold">الإختصاص <span class="star">*</span></label><input type="text" id="specialization2" class="w-full p-2 border rounded"></div>
        <div><label class="block font-semibold">تاريخ التخرج</label><input type="date" id="gradDate2" class="w-full p-2 border rounded"></div>
        <div><label class="block font-semibold">صورة لوثيقة التخرج</label><input type="file" id="gradDoc2" accept="image/*" class="w-full p-1 border rounded bg-white"></div>
        <div><label class="block font-semibold">تاريخ اول تعيين <span class="star">*</span></label><input type="date" id="firstAppDate2" class="w-full p-2 border rounded"></div>
        <div><label class="block font-semibold">صورة الوجه الامامي للامر الاداري <span class="star">*</span></label><input type="file" id="adminOrder2" accept="image/*" class="w-full p-1 border rounded bg-white"></div>
        <div><label class="block font-semibold">رقم الهاتف <span class="star">*</span></label><input type="text" id="phone2" class="w-full p-2 border rounded"></div>
        <div><label class="block font-semibold">عنوان السكن <span class="star">*</span></label><input type="text" id="address2" class="w-full p-2 border rounded"></div>
        <div><label class="block font-semibold">أقرب نقطة دالة <span class="star">*</span></label><input type="text" id="landmark2" class="w-full p-2 border rounded"></div>
        <div><label class="block font-semibold">صورة الوجه الخلفي للمباشرة</label><input type="file" id="commencementOrder2" accept="image/*" class="w-full p-1 border rounded bg-white"></div>

        <div class="flex gap-2 mt-6">
          <button type="button" onclick="showSection(1)" class="w-1/2 bg-gray-500 text-white py-2.5 rounded-lg font-bold">السابق</button>
          <button type="submit" class="w-1/2 bg-green-700 text-white py-2.5 rounded-lg font-bold">إرسال البيانات</button>
        </div>
      </div>

      <!-- القسم 3: الموظفين -->
      <div id="section3" class="space-y-4 hidden-section">
        <div class="bg-purple-100 p-3 rounded font-bold text-purple-800 text-lg border-r-4 border-purple-800">
          القسم 3 من 3: استمارة المعلومات الخاصة بالموظفين
        </div>

        <div><label class="block font-semibold">الاسم الرباعي <span class="star">*</span></label><input type="text" id="fullName3" class="w-full p-2 border rounded"></div>
        <div><label class="block font-semibold">اللقب <span class="star">*</span></label><input type="text" id="title3" class="w-full p-2 border rounded"></div>
        <div><label class="block font-semibold">تاريخ التولّد <span class="star">*</span></label><input type="date" id="dob3" class="w-full p-2 border rounded"></div>
        <div>
          <label class="block font-semibold">الجنس <span class="star">*</span></label>
          <select id="gender3" class="w-full p-2 border rounded"><option value="">اختر...</option><option value="ذكر">ذكر</option><option value="أنثى">أنثى</option></select>
        </div>
        <div><label class="block font-semibold">اسم الأم الثلاثي <span class="star">*</span></label><input type="text" id="motherName3" class="w-full p-2 border rounded"></div>
        <div><label class="block font-semibold">رقم البطاقة الموحدة <span class="star">*</span></label><input type="text" id="idNumber3" class="w-full p-2 border rounded"></div>
        <div><label class="block font-semibold">الوجه الأمامي للبطاقة الموحدة <span class="star">*</span></label><input type="file" id="idFront3" accept="image/*" class="w-full p-1 border rounded"></div>
        <div><label class="block font-semibold">الوجه الخلفي للبطاقة الموحدة <span class="star">*</span></label><input type="file" id="idBack3" accept="image/*" class="w-full p-1 border rounded"></div>
        <div><label class="block font-semibold">صورة شخصية للموظف <span class="star">*</span></label><input type="file" id="personalPhoto3" accept="image/*" class="w-full p-1 border rounded"></div>
        <div>
          <label class="block font-semibold">فصيلة الدم</label>
          <select id="bloodType3" class="w-full p-2 border rounded"><option value="">اختر...</option><option value="A+">A+</option><option value="A-">A-</option><option value="B+">B+</option><option value="B-">B-</option><option value="O+">O+</option><option value="O-">O-</option><option value="AB+">AB+</option><option value="AB-">AB-</option><option value="غير معروف">غير معروف</option></select>
        </div>
        <div>
          <label class="block font-semibold">الديانة <span class="star">*</span></label>
          <select id="religion3" class="w-full p-2 border rounded"><option value="">اختر...</option><option value="مسلم">مسلم</option><option value="مسيحي">مسيحي</option><option value="صابئي">صابئي</option><option value="إيزيدي">إيزيدي</option><option value="أخرى">أخرى</option></select>
        </div>
        <div>
          <label class="block font-semibold">الحالة الاجتماعية <span class="star">*</span></label>
          <select id="socialStatus3" class="w-full p-2 border rounded"><option value="">اختر...</option><option value="أعزب/عزباء">أعزب / عزباء</option><option value="متزوج/متزوجة">متزوج / متزوجة</option></select>
        </div>
        <div><label class="block font-semibold">العنوان الوظيفي <span class="star">*</span></label><input type="text" id="jobTitle3" placeholder="كاتب / معاون ملاحظ..." class="w-full p-2 border rounded"></div>
        <div><label class="block font-semibold">الحالة الوظيفية <span class="star">*</span></label><input type="text" id="jobStatus3" class="w-full p-2 border rounded"></div>
        <div><label class="block font-semibold">أخرى (نوع الإجازة / ملاحظات):</label><input type="text" id="jobStatusOther3" class="w-full p-2 border rounded"></div>
        <div><label class="block font-semibold">التحصيل الدراسي <span class="star">*</span></label><input type="text" id="qualification3" class="w-full p-2 border rounded"></div>
        <div><label class="block font-semibold">إسم الكلية / المعهد</label><input type="text" id="college3" class="w-full p-2 border rounded"></div>
        <div><label class="block font-semibold">الإختصاص</label><input type="text" id="specialization3" class="w-full p-2 border rounded"></div>
        <div><label class="block font-semibold">رقم الهاتف <span class="star">*</span></label><input type="text" id="phone3" class="w-full p-2 border rounded"></div>
        <div><label class="block font-semibold">تاريخ اول تعيين <span class="star">*</span></label><input type="date" id="firstAppDate3" class="w-full p-2 border rounded"></div>
        <div><label class="block font-semibold">صورة الوجه الامامي للامر الاداري <span class="star">*</span></label><input type="file" id="adminOrder3" accept="image/*" class="w-full p-1 border rounded bg-white"></div>
        <div><label class="block font-semibold">عنوان السكن <span class="star">*</span></label><input type="text" id="address3" class="w-full p-2 border rounded"></div>
        <div><label class="block font-semibold">أقرب نقطة دالة <span class="star">*</span></label><input type="text" id="landmark3" class="w-full p-2 border rounded"></div>
        <div><label class="block font-semibold">صورة الوجه الخلفي للمباشرة</label><input type="file" id="commencementOrder3" accept="image/*" class="w-full p-1 border rounded bg-white"></div>

        <div class="flex gap-2 mt-6">
          <button type="button" onclick="showSection(1)" class="w-1/2 bg-gray-500 text-white py-2.5 rounded-lg font-bold">السابق</button>
          <button type="submit" class="w-1/2 bg-green-700 text-white py-2.5 rounded-lg font-bold">إرسال البيانات</button>
        </div>
      </div>

      <div id="loading" class="hidden-section text-center py-6">
        <p class="text-purple-900 font-bold text-lg animate-pulse">جاري معالجة ورفع المستمسكات وإرسال البيانات، يرجى الانتظار... ⏳</p>
      </div>

    </form>
  </div>

  <script>
    // استبدل هذا الرابط برابط الـ Web App الجديد الخاص بك (الذي ينتهي بـ /exec)
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwqXJBulfrasKqebII1xh4_68MC5wrfyHizJJIdpTC91PIp640OGYf5HmgB5FGXq8na/exec";

    let activeSection = 1;

    function showSection(sectionNum) {
      document.getElementById('section1').classList.add('hidden-section');
      document.getElementById('section2').classList.add('hidden-section');
      document.getElementById('section3').classList.add('hidden-section');
      
      document.getElementById('section' + sectionNum).classList.remove('hidden-section');
      activeSection = sectionNum;
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function goToNextFromSection1() {
      const empType = document.getElementById('employeeType').value;
      if (!empType) {
        alert('يرجى اختيار نوع الموظف أولاً.');
        return;
      }
      if (empType === 'مدرس') {
        showSection(2);
      } else {
        showSection(3);
      }
    }

    // دالة تحويل ملف الصورة إلى Base64 بنجاح
    async function fileToBase64(fileInputId) {
      const input = document.getElementById(fileInputId);
      if (!input || !input.files || input.files.length === 0) return null;
      
      const file = input.files[0];
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve({ data: reader.result, name: file.name });
        reader.onerror = error => reject(error);
        reader.readAsDataURL(file);
      });
    }

    async function handleFormSubmit(e) {
      e.preventDefault();
      const sec = activeSection;

      document.getElementById('section' + sec).classList.add('hidden-section');
      document.getElementById('loading').classList.remove('hidden-section');

      const getVal = (id) => {
        const el = document.getElementById(id);
        return el ? el.value.trim() : "";
      };

      const formData = {
        employeeType: document.getElementById('employeeType').value,
        fullName: getVal(`fullName${sec}`),
        title: getVal(`title${sec}`),
        dob: getVal(`dob${sec}`),
        gender: getVal(`gender${sec}`),
        motherName: getVal(`motherName${sec}`),
        idNumber: getVal(`idNumber${sec}`),
        bloodType: getVal(`bloodType${sec}`),
        socialStatus: getVal(`socialStatus${sec}`),
        religion: getVal(`religion${sec}`),
        jobTitle: getVal(`jobTitle${sec}`),
        jobStatus: getVal(`jobStatus${sec}`),
        jobStatusOther: getVal(`jobStatusOther${sec}`),
        qualification: getVal(`qualification${sec}`),
        college: getVal(`college${sec}`),
        specialization: getVal(`specialization${sec}`),
        gradDate: getVal(`gradDate${sec}`),
        firstAppDate: getVal(`firstAppDate${sec}`),
        phone: getVal(`phone${sec}`),
        address: getVal(`address${sec}`),
        landmark: getVal(`landmark${sec}`)
      };

      // جمع الصور وتحويلها بشكل متزامن
      const filesData = {
        idFront: await fileToBase64(`idFront${sec}`),
        idBack: await fileToBase64(`idBack${sec}`),
        personalPhoto: await fileToBase64(`personalPhoto${sec}`),
        gradDoc: await fileToBase64(`gradDoc${sec}`),
        adminOrder: await fileToBase64(`adminOrder${sec}`),
        commencementOrder: await fileToBase64(`commencementOrder${sec}`)
      };

      fetch(SCRIPT_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ formData: formData, filesData: filesData })
      })
      .then(() => {
        alert("تم إرسال الاستمارة ورفع الصور بنجاح!");
        location.reload();
      })
      .catch((err) => {
        alert("حدث خطأ أثناء الإرسال: " + err);
        document.getElementById('loading').classList.add('hidden-section');
        document.getElementById('section' + sec).classList.remove('hidden-section');
      });
    }
  </script>
</body>
</html>
