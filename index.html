<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>استمارة معلومات الكادر الخاصة بالعقود</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #1a102f; color: #fff; padding: 15px; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 600px; background: #251842; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
    .header { text-align: center; margin-bottom: 20px; }
    .header img { width: 80px; height: 80px; }
    .header h2 { font-size: 1.2rem; margin-top: 10px; color: #e0e0e0; }
    .header h3 { font-size: 0.9rem; color: #a594c7; margin-top: 5px; }

    .stepper { display: flex; justify-content: space-around; margin-bottom: 25px; position: relative; }
    .step { width: 35px; height: 35px; border-radius: 50%; background: #3d2b63; display: flex; align-items: center; justify-content: center; font-weight: bold; color: #aaa; z-index: 1; }
    .step.active { background: #e2a03f; color: #000; }
    .step.completed { background: #4caf50; color: #fff; }

    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-size: 0.9rem; color: #d1c4e9; }
    input, select, textarea { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #4a3875; background: #150c27; color: #fff; font-size: 0.95rem; }
    input:focus, select:focus { border-color: #e2a03f; outline: none; }

    .btn { width: 100%; padding: 12px; border: none; border-radius: 6px; font-size: 1rem; font-weight: bold; cursor: pointer; margin-top: 10px; transition: 0.3s; }
    .btn-primary { background: #e2a03f; color: #000; }
    .btn-primary:hover { background: #d19030; }
    .btn-secondary { background: #4a3875; color: #fff; margin-top: 5px; }

    .hidden-section { display: none !important; }

    /* Modal / Alert styles */
    .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.7); display: flex; align-items: center; justify-content: center; z-index: 999; }
    .modal-box { background: #fff; color: #333; padding: 25px; border-radius: 12px; width: 90%; max-width: 380px; text-align: center; box-shadow: 0 4px 20px rgba(0,0,0,0.4); }
    .modal-box h3 { margin-bottom: 15px; font-size: 1.1rem; }
    .modal-box button { background: #4a148c; color: #fff; border: none; padding: 10px 25px; border-radius: 6px; font-size: 1rem; cursor: pointer; }

    /* Progress bar */
    .progress-bar-container { background: #150c27; border-radius: 10px; height: 12px; width: 100%; overflow: hidden; margin: 15px 0; }
    .progress-bar { background: #e2a03f; height: 100%; width: 0%; transition: width 0.3s ease; }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <h2>وزارة التربية / المديرية العامة لتربية البصرة</h2>
    <h3>استمارة معلومات الكادر الخاصة بالعقود</h3>
  </div>

  <!-- الخطوات -->
  <div class="stepper">
    <div class="step active" id="step1">1</div>
    <div class="step" id="step2">2</div>
    <div class="step" id="step3">3</div>
  </div>

  <!-- النموذج -->
  <form id="mainForm" onsubmit="return false;">
    
    <!-- القسم الأول: اختيار نوع الكادر -->
    <div id="section1">
      <div class="form-group">
        <label>نوع الكادر:</label>
        <select id="employeeType" required>
          <option value="">-- اختر نوع الكادر --</option>
          <option value="تعليمي/تدريسي">تعليمي / تدريسي</option>
          <option value="إداري/موضفي الخدمة">إداري / موظفي الخدمة</option>
        </select>
      </div>
      <button type="button" class="btn btn-primary" onclick="goToStep2()">التالي</button>
    </div>

    <!-- القسم الثاني: البيانات الشخصية والوظيفية -->
    <div id="section2" class="hidden-section">
      <div class="form-group">
        <label>الاسم الرباعي:</label>
        <input type="text" id="fullName2" required>
      </div>
      <div class="form-group">
        <label>اللقب:</label>
        <input type="text" id="title2">
      </div>
      <div class="form-group">
        <label>تاريخ التولد:</label>
        <input type="date" id="dob2" required>
      </div>
      <div class="form-group">
        <label>الجنس:</label>
        <select id="gender2" required>
          <option value="">-- اختر --</option>
          <option value="ذكر">ذكر</option>
          <option value="أنثى">أنثى</option>
        </select>
      </div>
      <div class="form-group">
        <label>اسم الأم الثلاثي:</label>
        <input type="text" id="motherName2" required>
      </div>
      <div class="form-group">
        <label>رقم البطاقة الموحدة:</label>
        <input type="text" id="idNumber2" required>
      </div>
      <div class="form-group">
        <label>فصيلة الدم:</label>
        <input type="text" id="bloodType2">
      </div>
      <div class="form-group">
        <label>الحالة الاجتماعية:</label>
        <select id="socialStatus2" required>
          <option value="">-- اختر --</option>
          <option value="أعزب/عزباء">أعزب / عزباء</option>
          <option value="متزوج/متزوجة">متزوج / متزوجة</option>
          <option value="مطلق/مطلقة">مطلق / مطلقة</option>
          <option value="أرمل/أرملة">أرمل / أرملة</option>
        </select>
      </div>
      <div class="form-group">
        <label>الديانة:</label>
        <input type="text" id="religion2">
      </div>
      <div class="form-group">
        <label>الموقف الوظيفي:</label>
        <select id="jobStatus2" onchange="toggleJobStatusOther('2')">
          <option value="مستمر بالخدمة">مستمر بالخدمة</option>
          <option value="مجاز">مجاز</option>
          <option value="أخرى">أخرى</option>
        </select>
      </div>
      <div class="form-group hidden-section" id="jobStatusOtherGroup2">
        <label>توضيح الموقف الوظيفي:</label>
        <input type="text" id="jobStatusOther2">
      </div>
      <div class="form-group">
        <label>المؤهل الدراسي:</label>
        <input type="text" id="qualification2" required>
      </div>
      <div class="form-group">
        <label>الكلية / المعهد:</label>
        <input type="text" id="college2">
      </div>
      <div class="form-group">
        <label>التخصص:</label>
        <input type="text" id="specialization2">
      </div>
      <div class="form-group">
        <label>تاريخ التخرج:</label>
        <input type="date" id="gradDate2">
      </div>
      <div class="form-group">
        <label>تاريخ المباشرة الأولى:</label>
        <input type="date" id="firstAppDate2">
      </div>
      <div class="form-group">
        <label>رقم الهاتف:</label>
        <input type="tel" id="phone2" required>
      </div>
      <div class="form-group">
        <label>عنوان السكن الحالي:</label>
        <input type="text" id="address2" required>
      </div>
      <div class="form-group">
        <label>أقرب نقطة دالة:</label>
        <input type="text" id="landmark2">
      </div>

      <!-- المرفقات -->
      <h3 style="margin: 15px 0 10px 0; color: #e2a03f;">المرفقات والصور</h3>
      <div class="form-group"><label>وجه البطاقة الموحدة:</label><input type="file" id="idFront2" accept="image/*"></div>
      <div class="form-group"><label>ظهر البطاقة الموحدة:</label><input type="file" id="idBack2" accept="image/*"></div>
      <div class="form-group"><label>الصورة الشخصية:</label><input type="file" id="personalPhoto2" accept="image/*"></div>
      <div class="form-group"><label>وثيقة التخرج:</label><input type="file" id="gradDoc2" accept="image/*"></div>
      <div class="form-group"><label>الأمر الإداري:</label><input type="file" id="adminOrder2" accept="image/*"></div>
      <div class="form-group"><label>أمر المباشرة:</label><input type="file" id="commencementOrder2" accept="image/*"></div>

      <button type="button" class="btn btn-primary" onclick="goToStep3()">التالي (المراجعة)</button>
      <button type="button" class="btn btn-secondary" onclick="backToStep1()">السابق</button>
    </div>

    <!-- القسم الثالث: المراجعة والإرسال -->
    <div id="reviewSection" class="hidden-section">
      <h3 style="color: #e2a03f; margin-bottom: 15px; text-align: center;">مراجعة البيانات قبل الإرسال</h3>
      <div id="reviewContent" style="font-size: 0.9rem; line-height: 1.8; background: #150c27; padding: 15px; border-radius: 8px; margin-bottom: 15px;"></div>
      <button type="button" class="btn btn-primary" onclick="confirmAndSubmit()">تأكيد وإرسال الاستمارة</button>
      <button type="button" class="btn btn-secondary" onclick="backToStep2()">تعديل البيانات</button>
    </div>

    <!-- حالة التحميل والرفع -->
    <div id="loading" class="hidden-section" style="text-align: center; padding: 20px;">
      <h3 id="progressText" style="color: #e2a03f; margin-bottom: 10px;">جاري إرسال البيانات...</h3>
      <div class="progress-bar-container">
        <div class="progress-bar" id="progressBar"></div>
      </div>
    </div>

    <!-- كارت النجاح -->
    <div id="successCard" class="hidden-section" style="text-align: center; padding: 20px;">
      <h2 style="color: #4caf50; margin-bottom: 10px;">تم الإرسال بنجاح!</h2>
      <p>تم تسجيل بياناتك ومرفقاتك بنجاح في النظام.</p>
    </div>

  </form>
</div>

<!-- التنبيهات (Modal Alert) -->
<div id="customAlert" class="modal-overlay hidden-section">
  <div class="modal-box">
    <div style="font-size: 2rem; color: #ff9800; margin-bottom: 10px;">⚠️</div>
    <h3 id="alertText">حدث خطأ ما</h3>
    <button onclick="closeCustomAlert()">حسناً</button>
  </div>
</div>

<script>
  // ضع هنا رابط الـ Web App الخاص بك من Google Apps Script
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycby61orG6cnhsu6h3ebWRTaJ2Ox9WfEK9m9_ozRZ91ZtJmjwbyiUZlEed0HuMZdJVX7F/exec";

  let activeSection = 2;

  function showCustomAlert(msg) {
    document.getElementById('alertText').innerText = msg;
    document.getElementById('customAlert').classList.remove('hidden-section');
  }

  function closeCustomAlert() {
    document.getElementById('customAlert').classList.add('hidden-section');
  }

  function toggleJobStatusOther(sec) {
    const status = document.getElementById(`jobStatus${sec}`).value;
    const group = document.getElementById(`jobStatusOtherGroup${sec}`);
    if (status === 'أخرى') {
      group.classList.remove('hidden-section');
    } else {
      group.classList.add('hidden-section');
    }
  }

  function goToStep2() {
    const type = document.getElementById('employeeType').value;
    if (!type) {
      showCustomAlert("يرجى اختيار نوع الكادر أولاً.");
      return;
    }
    document.getElementById('section1').classList.add('hidden-section');
    document.getElementById('section2').classList.remove('hidden-section');
    document.getElementById('step1').classList.remove('active');
    document.getElementById('step1').classList.add('completed');
    document.getElementById('step2').classList.add('active');
  }

  function backToStep1() {
    document.getElementById('section2').classList.add('hidden-section');
    document.getElementById('section1').classList.remove('hidden-section');
    document.getElementById('step2').classList.remove('active');
    document.getElementById('step1').classList.add('active');
  }

  function goToStep3() {
    const sec = activeSection;
    const fullName = document.getElementById(`fullName${sec}`).value;
    const phone = document.getElementById(`phone${sec}`).value;

    if (!fullName || !phone) {
      showCustomAlert("يرجى ملء الحقول المطلوبة (الاسم الرباعي ورقم الهاتف على الأقل).");
      return;
    }

    let reviewHtml = `
      <p><strong>نوع الكادر:</strong> ${document.getElementById('employeeType').value}</p>
      <p><strong>الاسم الرباعي:</strong> ${fullName}</p>
      <p><strong>رقم الهاتف:</strong> ${phone}</p>
      <p><strong>تاريخ التولد:</strong> ${document.getElementById(`dob${sec}`).value}</p>
      <p><strong>عنوان السكن:</strong> ${document.getElementById(`address${sec}`).value}</p>
    `;

    document.getElementById('reviewContent').innerHTML = reviewHtml;
    document.getElementById('section2').classList.add('hidden-section');
    document.getElementById('reviewSection').classList.remove('hidden-section');
    document.getElementById('step2').classList.remove('active');
    document.getElementById('step2').classList.add('completed');
    document.getElementById('step3').classList.add('active');
  }

  function backToStep2() {
    document.getElementById('reviewSection').classList.add('hidden-section');
    document.getElementById('section2').classList.remove('hidden-section');
    document.getElementById('step3').classList.remove('active');
    document.getElementById('step2').classList.add('active');
  }

  function setProgress(percent, text) {
    document.getElementById('progressBar').style.width = percent + '%';
    document.getElementById('progressText').innerText = text;
  }

  function fileToBase64(inputId, onDone) {
    return new Promise((resolve) => {
      const input = document.getElementById(inputId);
      if (!input || !input.files || !input.files[0]) {
        if (onDone) onDone();
        resolve("");
        return;
      }
      const reader = new FileReader();
      reader.onload = function(e) {
        if (onDone) onDone();
        resolve(e.target.result);
      };
      reader.onerror = function() {
        if (onDone) onDone();
        resolve("");
      };
      reader.readAsDataURL(input.files[0]);
    });
  }

  async function confirmAndSubmit() {
    if (!SCRIPT_URL || SCRIPT_URL.includes("ضع_رابط_السكربت")) {
      showCustomAlert("يرجى فتح ملف Index.html ووضع رابط السكربت الخاص بك في متغير SCRIPT_URL أولاً.");
      return;
    }

    const sec = activeSection;

    document.getElementById('reviewSection').classList.add('hidden-section');
    document.getElementById('loading').classList.remove('hidden-section');

    setProgress(10, "جاري قراءة وتجهيز البيانات...");

    const getVal = (id) => {
      const el = document.getElementById(id);
      return el ? el.value.trim() : "";
    };

    const formData = {
      employeeType: document.getElementById('employeeType').value,
      fullName: getVal(`fullName${sec}`),
      title: getVal(`title${sec}`),
      dob: getVal(`dob${sec}`),
      gender: getVal(`gender${sec}`),
      motherName: getVal(`motherName${sec}`),
      idNumber: getVal(`idNumber${sec}`),
      bloodType: getVal(`bloodType${sec}`),
      socialStatus: getVal(`socialStatus${sec}`),
      religion: getVal(`religion${sec}`),
      jobTitle: getVal(`jobTitle${sec}`),
      jobStatus: getVal(`jobStatus${sec}`),
      jobStatusOther: getVal(`jobStatusOther${sec}`),
      qualification: getVal(`qualification${sec}`),
      college: getVal(`college${sec}`),
      specialization: getVal(`specialization${sec}`),
      gradDate: getVal(`gradDate${sec}`),
      firstAppDate: getVal(`firstAppDate${sec}`),
      phone: getVal(`phone${sec}`),
      address: getVal(`address${sec}`),
      landmark: getVal(`landmark${sec}`)
    };

    let processedFiles = 0;
    const totalFiles = 6;
    const onFileDone = () => {
      processedFiles++;
      const target = 10 + Math.round((processedFiles / totalFiles) * 50);
      setProgress(target, `جاري تحضير الملف ${processedFiles} من ${totalFiles}...`);
    };

    const filesData = {
      idFront: await fileToBase64(`idFront${sec}`, onFileDone),
      idBack: await fileToBase64(`idBack${sec}`, onFileDone),
      personalPhoto: await fileToBase64(`personalPhoto${sec}`, onFileDone),
      gradDoc: await fileToBase64(`gradDoc${sec}`, onFileDone),
      adminOrder: await fileToBase64(`adminOrder${sec}`, onFileDone),
      commencementOrder: await fileToBase64(`commencementOrder${sec}`, onFileDone)
    };

    setProgress(85, "جاري رفع البيانات وإرسالها للسيرفر...");

    try {
      const response = await fetch(SCRIPT_URL, {
        method: "POST",
        redirect: "follow",
        headers: {
          "Content-Type": "text/plain;charset=utf-8"
        },
        body: JSON.stringify({ formData: formData, filesData: filesData })
      });

      const textResult = await response.text();
      let res;
      try {
        res = JSON.parse(textResult);
      } catch (e) {
        res = { result: "success" };
      }

      if (res.result === "success") {
        setProgress(100, "تم الإرسال والحفظ بنجاح!");
        setTimeout(() => {
          document.getElementById('loading').classList.add('hidden-section');
          document.getElementById('successCard').classList.remove('hidden-section');
          window.scrollTo({ top: 0, behavior: 'smooth' });
        }, 500);
      } else {
        throw new Error(res.message || "حدث خطأ غير معروف.");
      }
    } catch (err) {
      showCustomAlert("حدث خطأ أثناء الإرسال: " + err.message);
      document.getElementById('loading').classList.add('hidden-section');
      document.getElementById('reviewSection').classList.remove('hidden-section');
    }
  }
</script>

</body>
</html>
